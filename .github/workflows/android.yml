# Build + tests à chaque push / PR. Sur un tag vX.Y.Z : APK signé avec la clé release,
# publié en release GitHub (source de la mise à jour automatique de la box).
name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    paths-ignore:
      - dashboard/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Tests et build
        run: ./gradlew test assembleRelease

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Clé de signature
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 absent : pas de release signée avec la clé debug."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signé
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew assembleRelease -PappVersion="$VERSION"
          mv app/build/outputs/apk/release/app-release.apk "LittleAndroidBrother-$VERSION.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Vérifier la signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "LittleAndroidBrother-$VERSION.apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then
            echo "::error::APK signé avec la clé debug."
            exit 1
          fi

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "LittleAndroidBrother-$VERSION.apk" --title "$GITHUB_REF_NAME" --generate-notes
