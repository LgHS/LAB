# Régénère les horaires TEC du tableau de bord (dashboard/tec_*.csv) à partir du GTFS
# officiel, quand transport.json change et chaque semaine (nouveaux horaires TEC).
name: Dashboard – horaires TEC

on:
  push:
    paths:
      - dashboard/transport.json
      - tools/extract_tec_schedule.py
  schedule:
    - cron: "17 3 * * 1" # lundi 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-tec
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Extraire les horaires
        run: python3 tools/extract_tec_schedule.py

      - name: Commit si changement
        run: |
          git add dashboard/
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "dashboard: horaires TEC $(jq -r .validUntil dashboard/generated.json)"
          git push
